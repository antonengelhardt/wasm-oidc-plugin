[package]
publish = false
name = "wasm-oidc-plugin"
version = "0.6.0"
authors = [
    "WWU Cloud Developer <cloud@uni-muenster.de>, Anton Engelhardt <antoncengelhardt@icloud.com>",
]
description = "A plugin for the Envoy-Proxy written in Rust. It implements the OIDC Authorization Code Flow and the Token Exchange Flow, stores the session in an encrypted cookie and validates the token."
license = "Apache-2.0"
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
regex = "1.13.1"
aes-gcm = "0.11.0"
base64 = "0.23.1"
jwt-simple = "0.13.0"
# Fork that accepts RSA moduli larger than 4096 bits (package name stays jwt-simple).
jwt-simple-legacy = { package = "jwt-simple-legacy", git = "https://github.com/antonengelhardt/rust-jwt-simple", branch = "master" }
log = "0.4.33"
proxy-wasm = "0.2.5"
pkce = "0.2.0"
sec = { version = "1.0.0", features = ["serde", "deserialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
serde_regex = "1.2.0"
thiserror = "2.0.19"
url = { version = "2.5.8", features = ["serde"] }
html-escape = "0.2.15"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "debuginfo"
