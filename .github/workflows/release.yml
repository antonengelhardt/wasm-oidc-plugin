name: Release new version

on:
  push:
    tags:
      - v*

jobs:
  build:
    name: Build and upload artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust with wasm32-wasip1
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build
        run: cargo build --target wasm32-wasip1 --release

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm_oidc_plugin.wasm
          path: target/wasm32-wasip1/release/wasm_oidc_plugin.wasm

  docker-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract version from Github Ref
        id: extract_version
        run: |
          echo VERSION=$(echo ${{ github.ref }} | grep -o "v[0-9]\+\.[0-9]\+\.[0-9]\+") >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            antonengelhardt/wasm-oidc-plugin:${{ env.VERSION }}
            antonengelhardt/wasm-oidc-plugin:latest
          cache-from: type=registry,ref=antonengelhardt/wasm-oidc-plugin:latest
          cache-to: type=inline

  ghcr-image:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Github Ref
        id: extract_version
        run: |
          echo VERSION=$(echo ${{ github.ref }} | grep -o "v[0-9]\+\.[0-9]\+\.[0-9]\+") >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/antonengelhardt/wasm-oidc-plugin:${{ env.VERSION }}
            ghcr.io/antonengelhardt/wasm-oidc-plugin:latest
          cache-from: type=registry,ref=ghcr.io/antonengelhardt/wasm-oidc-plugin:latest
          cache-to: type=inline
