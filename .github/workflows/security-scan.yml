name: Security Scan

on:
  pull_request:
  schedule:
    # 00:00 Europe/Berlin during CEST (23:00 CET in winter)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build container image for scanning
        run: docker build -t scan:pr .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:pr
          severity: CRITICAL,HIGH
          exit-code: "1"
