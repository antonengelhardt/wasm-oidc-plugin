name: Test

on:
  pull_request:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust with wasm32-wasip1
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Clippy
        run: cargo clippy --release --all-targets --target=wasm32-wasip1 -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Fmt
        run: cargo fmt -- --check

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install cargo audit
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit

  verify-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Verify Rust toolchain
        run: |
          rustc --version
          rustup show active-toolchain

      - name: Verify project
        run: cargo verify-project

  outdated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install cargo-outdated
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-outdated

      - name: Outdated
        run: cargo outdated --root-deps-only --exit-code 1

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Test
        run: cargo test --workspace

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust with wasm32-wasip1
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build wasm-oidc-plugin
        run: cargo build --target wasm32-wasip1 --release

      - name: Upload plugin as artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: target/wasm32-wasip1/release/wasm_oidc_plugin.wasm

  ghcr-image:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sanitize branch name for image tag
        id: image_tag
        env:
          BRANCH_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          sanitized="$(printf '%s' "$BRANCH_REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          echo "tag=pr-${sanitized}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/antonengelhardt/wasm-oidc-plugin:${{ steps.image_tag.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/antonengelhardt/wasm-oidc-plugin:${{ steps.image_tag.outputs.tag }}
          cache-to: type=inline
